# Builds the container image and publishes it to GHCR.
#
# Runs on a version tag, so the image and the release always describe the same
# code: `git tag v1.6.2 && git push --tags` is the whole publishing step.
name: Container image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # arm64 as well: a self-hosted music server is as likely to be a Pi or a
      # small ARM box as it is an x86 machine. The arm64 leg runs under
      # emulation and takes its time – this image carries ffmpeg, yt-dlp,
      # deno, spotDL and beets.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # Lower case on purpose: GHCR rejects capitals, and the owner is
          # written "Jannehy".
          images: ghcr.io/jannehy/nightshift
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
