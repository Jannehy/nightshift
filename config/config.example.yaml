# ============================================================
# Nightshift – central configuration
# Copy this file to config.yaml and adjust it.
# Every value can also be set via environment variable
# (NIGHTSHIFT_<SECTION>_<KEY>, e.g. NIGHTSHIFT_SERVER_PORT).
# ============================================================

server:
  host: "0.0.0.0"
  port: 8765
  # UI language: de | en | es | fr | pl | ru | ja
  language: "de"
  # Theme default: dark | light | auto
  theme: "auto"

library:
  # Root of the music library (inside Docker: /music)
  music_root: "/music"
  # Subfolder for Spotify downloads (relative to music_root)
  spotify_dir: "playlists"
  # spotDL output template (relative to music_root)
  spotify_output_template: "playlists/{album-artist}/{album}/{track-number} - {title}.{output-ext}"
  # Subfolders for SoundCloud and YouTube downloads
  soundcloud_dir: "SoundCloud"
  youtube_dir: "YouTube"

downloads:
  # Cookie file for YouTube (Netscape format), empty = no cookies
  youtube_cookie_file: "/config/cookies/yt-cookies.txt"
  # Optional cookie file for SoundCloud (e.g. Go+ account)
  soundcloud_cookie_file: ""
  # spotDL settings
  spotify_format: "mp3"
  spotify_bitrate: "320k"
  spotify_threads: 8
  # Retries for downloads started from the web UI
  max_attempts: 5
  retry_wait_seconds: 3

nightly:
  # Schedule of the nightly sync (cron syntax, default 23:00)
  schedule: "0 23 * * *"
  # Directory of .spotdl sync files (inside the container: /config/spotdl-sync)
  spotdl_sync_dir: "/config/spotdl-sync"
  # Timeout per playlist sync in seconds (prevents hangs on rate limits)
  sync_timeout_seconds: 900
  # Retries per playlist
  max_attempts: 10
  # Fetch lyrics after downloading (Spotify pipeline only)
  fetch_lyrics: true

sync:
  # Offer the sync playlist option in the UI (admins can turn it off here)
  enabled: true
  # Registry file for SoundCloud/YouTube sync playlists
  registry_file: "/config/sync-registry.json"

beets:
  # Enable beets integration (import without autotagging for SC/YT)
  enabled: true
  # Path to a beets config (empty = beets default)
  config_file: ""

navidrome:
  # Navidrome integration (playlist visibility/owner assignment). Optional.
  enabled: false
  url: "http://localhost:4533"
  # Service account with admin rights (used only for playlist management)
  username: ""
  password: ""
  # Make new playlists public by default
  default_public: true
  # Wait for the playlist import (retries × seconds)
  import_retries: 20
  import_retry_delay: 3

logging:
  # Log directory (inside the container: /config/logs)
  dir: "/config/logs"
