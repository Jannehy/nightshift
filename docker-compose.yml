services:
  nightshift:
    image: ghcr.io/jannehy/nightshift:latest
    container_name: nightshift
    ports:
      - "8765:8765"
    volumes:
      # Everything Nightshift keeps: config, cookies, logs, the sync registry
      # and the beets database and configuration.
      - ./config:/config
      # Your music library. Change the left side only – inside the container
      # the library is always /music.
      - /path/to/your/music:/music
    environment:
      # The user the files should belong to. Must be able to write to the
      # library: id -u and id -g on the host tell you the numbers.
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    restart: unless-stopped
