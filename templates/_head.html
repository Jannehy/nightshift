<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">

<!-- Saved to a home screen, the page is an app icon like any other.
     Without these it falls back to a screenshot or the first letter.
     apple-touch-icon carries no transparency on purpose: iOS fills
     a transparent icon with black. -->
<link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16.png">
<link rel="manifest" href="/static/site.webmanifest">
<meta name="apple-mobile-web-app-title" content="Nightshift">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffb03a">
<script src="/static/app.js" defer></script>
<script>
  // Apply the theme before first paint (no flash)
  (function () {
    var t = localStorage.getItem("ns-theme") || "auto";
    if (t === "auto") {
      t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    document.documentElement.dataset.theme = t;
  })();
</script>
